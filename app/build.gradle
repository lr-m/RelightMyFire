plugins {
    id 'com.android.application'
}

android {
    compileSdk 25

    defaultConfig {
        applicationId "com.relightmyfire"
        minSdk 21
        targetSdk 25
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {}
